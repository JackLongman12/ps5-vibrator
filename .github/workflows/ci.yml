name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DualSenseStudio.sln

      - name: Build
        run: dotnet build DualSenseStudio.sln -c Release --no-restore

      - name: Test
        run: dotnet test DualSenseStudio.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Vulnerable package check
        shell: pwsh
        run: |
          $out = dotnet list DualSenseStudio.sln package --vulnerable --include-transitive 2>&1
          $out
          if ($out -match 'has the following vulnerable packages') { exit 1 }
